<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>
<body>
    <header>
        <h1>Acme Support</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#help">Help</a>
            <a href="Contact">Contact</a>
        </nav>
    </header>
    <main>
        <h1>Contact us</h1>
        <p>send us a message and we will get back to you.</p>

        <form action="/api/contact" method="post">

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <select name="subject" id="select">
                    <option value="">Choose a topic</option>
                    <option value="billing">Billing</option>
                    <option value="technical">Technical</option>
                    <option value="general">General</option>
                    <option value="feedback">Feedback</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea name="message" id="message" required minlength="10"></textarea>
            </div>

            <fieldset>
                <legend>How did you hear about us?</legend>
                <div class="radio-option">
                    <input type="radio" id="source-search" name="source" value="search">
                    <label for="source-search">Search</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="source-friend" name="source" value="friend">
                    <label for="source-friend">Friends</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="source-social" name="source" value="social">
                    <label for="source-social">Social</label>
                </div>
            </fieldset>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="newsletter" name="newsletter" value="yes" checked>
                    <label for="newsletter">Send me product updates</label>
                </div>
            </div>
        </form>

        <button type="submit">Send Message</button>
    </main>

    <hr>

    <footer>
        <p>&copy; 2026 Acme Support</p>
    </footer>
</body>
</html>
